# Split arm deeptex_split_nb7_b8: deeptex_split_nb7 with 8 materials per step.
# Three group generators (albedo / normal / [0,R,M]), RRDB nb=7 each, trained JOINTLY
# through one render loss (split/train.py, docs/SPLIT_THEORY.md A2).
#
# Why: at batch 2 materials each split generator (and its D) gets 2 images per update,
# where the shared deeptex_renloss_21 G gets 10 (2 materials x 5 maps) and the paper
# recipe (esrgan_matsynth.yaml) 8. Here every split generator gets 8 images per update.
# What it costs: 40k steps x 8 materials = 4x the material crops deeptex_split_nb7 and
# deeptex_renloss_21 see, and the step-for-step pairing with renloss_21's crop stream
# is gone (same record stream, same seed, 8 records per step instead of 2). Compare it
# with deeptex_split_nb7 for the batch effect; against renloss_21 it is not data-matched.
#
# EXACT DIFF against deeptex_split_nb7.yaml, and only these:
#   batch_size             2 -> 8   (materials per step; each group network sees 8 images)
#   checkpoint_root/log_root  -> /workspace/runs/deeptex/deeptex_split_nb7_b8/...
# w_render_groups is unchanged: kappa_g comes from the batch composition only and
# does not depend on B (SPLIT_THEORY A2-5). lr / Adam / steps / loss weights unchanged.
# Memory: the render term scales with B (8 materials x 100 lights). If the smoke run
# runs out of memory, set render.light_chunks: 4 (same values, recomputed per chunk).

# general setting
batch_size: 8               # materials per step; each group network sees 8 images
input_size: 32
gt_size: 128
ch_size: 3
scale: 4
sub_name: 'esrgan_40k'
pretrain_name: './checkpoints/'

seed: 1

checkpoint_root: '/workspace/runs/deeptex/deeptex_split_nb7_b8/checkpoints'
log_root: '/workspace/runs/deeptex/deeptex_split_nb7_b8/logs'

# generator setting (per group)
network_G:
    nf: 64
    nb: 7

# dataset setting
train_dataset:
    path: '/data/TexSR-data/deeptex/matsynth_grouped/matsynth_grouped_lrx4.tfrecord'
    grouped: True
    using_bin: True
    using_flip: True
    using_rot: True

# training setting
niter: 40000

lr_G: !!float 1e-4
lr_D: !!float 1e-4
lr_steps: [50000, 100000, 200000, 300000]
lr_rate: 0.5

adam_beta1_G: 0.9
adam_beta2_G: 0.99
adam_beta1_D: 0.9
adam_beta2_D: 0.99

w_pixel: !!float 1e-2
pixel_criterion: l1

w_feature: 1.0
feature_criterion: l1

w_gan: !!float 5e-3
gan_type: ragan

save_steps: 5000

# Render weight per group = kappa_g x 10.0 (deeptex_renloss_21's calibrated w_render).
# kappa equalises the loss normalisation with the shared run (SPLIT_THEORY A2-5):
#   a, n : the shared pixel/feature/gan means run over 5B images, a group's over B -> x5
#   rm   : x5 for the same reason, /3 because the shared decode averages R's three
#          channels (1/3 of dL/dR per channel) while here R is one channel -> 5/3
w_render_groups:
    a: !!float 50.0
    n: !!float 50.0
    rm: !!float 16.6666667

render:
    n_lights: 100
    light_radius: !!float 1.4
    intensity: !!float 8.0
    disp_val: !!float 0.01
    min_roughness: !!float 0.045
    min_alpha: !!float 2.0e-3
    nz_min: !!float 1.0e-3
    mask_min_norm: !!float 0.1
    normal_norm_floor: !!float 1.0e-4
    light_chunks: 1                     # 4 = recompute_grad memory fallback (same value)
